  </defs>
  <rect width="580" height="140" rx="8" fill="url(#bgAutoCanvas)" stroke="#1e2d45" stroke-width="1"/>
  <rect x="0" y="0" width="580" height="2.5" rx="8" fill="#2E4AF9" opacity="0.5"/>
  <g class="mono" font-size="9" fill="#5a6b82" letter-spacing="1">
