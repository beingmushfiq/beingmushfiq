  </g>
  <line x1="18" y1="30" x2="562" y2="30" stroke="#1e2d45" stroke-width="0.6"/>
  
  <!-- Node 1 -->
  <g transform="translate(18, 42)">
    <rect width="160" height="56" rx="4" fill="#001129" stroke="#1e2d45" stroke-width="0.8"/>
    <text class="mono" x="10" y="18" font-size="8" fill="#2E4AF9" font-weight="600">STUDIO LAYER</text>
    <text class="sans" x="10" y="36" font-size="11.5" font-weight="700" fill="#f0f4ff">AI Creation Studio</text>
    <text class="sans" x="10" y="50" font-size="9" fill="#8391A8">Copy · Media · Variations</text>
  </g>

  <!-- Flow 1 -->
  <g transform="translate(182, 70)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#2E4AF9" stroke-width="1" stroke-dasharray="3 2"/>
    <polygon points="20,0 15,-3 15,3" fill="#2E4AF9"/>
  </g>

  <!-- Node 2 -->
  <g transform="translate(206, 42)">
    <rect width="172" height="56" rx="4" fill="#001333" stroke="#2E4AF9" stroke-width="0.8"/>
    <text class="mono" x="10" y="18" font-size="8" fill="#5277FF" font-weight="600">DISPATCH CORE</text>
    <text class="sans" x="10" y="36" font-size="11.5" font-weight="700" fill="#f0f4ff">Content Calendar</text>
    <text class="sans" x="10" y="50" font-size="9" fill="#c4d0e2">Omnichannel Scheduling</text>
  </g>

  <!-- Flow 2 -->
  <g transform="translate(382, 70)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#2E4AF9" stroke-width="1" stroke-dasharray="3 2"/>
    <polygon points="20,0 15,-3 15,3" fill="#2E4AF9"/>
  </g>

  <!-- Node 3 -->
  <g transform="translate(406, 42)">
    <rect width="156" height="56" rx="4" fill="#001129" stroke="#1e2d45" stroke-width="0.8"/>
    <text class="mono" x="10" y="18" font-size="8" fill="#2E4AF9" font-weight="600">INTELLIGENCE</text>
    <text class="sans" x="10" y="36" font-size="11.5" font-weight="700" fill="#f0f4ff">Channel Analytics</text>
