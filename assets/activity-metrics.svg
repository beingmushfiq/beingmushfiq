<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="auto" role="img" aria-labelledby="metricsTitle metricsDesc">
  <title id="metricsTitle">Mushfiqur Rahman — Codebase Distribution &amp; Engineering Metrics</title>
  <desc id="metricsDesc">Telemetry dashboard showing verified language breakdown across 64 repositories and core engineering focus areas.</desc>

  <defs>
    <linearGradient id="mBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000814"/>
      <stop offset="50%" stop-color="#000F26"/>
      <stop offset="100%" stop-color="#001233"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001333" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#000d21" stop-opacity="0.95"/>
    </linearGradient>

    <pattern id="mGridPattern" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#24334D" stroke-width="0.5" stroke-opacity="0.25"/>
    </pattern>

    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="260" rx="10" fill="url(#mBgGrad)" stroke="#1e2d45" stroke-width="1"/>
  <rect width="1200" height="260" rx="10" fill="url(#mGridPattern)"/>

  <!-- Top Laser Hairline Accent -->
  <rect x="0" y="0" width="1200" height="2" fill="#2E4AF9" opacity="0.8"/>

  <!-- Top Metadata Bar -->
  <g class="mono" font-size="9.5" fill="#5a6b82" letter-spacing="1.5">
    <text x="36" y="28">CODEBASE TELEMETRY // VERIFIED DISTRIBUTION &amp; BENCHMARKS</text>
    <a href="https://github.com/beingmushfiq?tab=repositories" target="_blank">
      <text x="1164" y="28" text-anchor="end" fill="#2E4AF9" font-weight="600">INSPECT ALL 64 REPOSITORIES ↗</text>
    </a>
  </g>
  <line x1="36" y1="38" x2="1164" y2="38" stroke="#1e2d45" stroke-width="0.8"/>

  <!-- ========================================================= -->
  <!-- LEFT PANEL: Language Distribution                         -->
  <!-- ========================================================= -->
  <g transform="translate(36, 52)">
    <g class="mono" font-size="8.5" fill="#8391A8" letter-spacing="1.2">
      <text x="0" y="10">LANGUAGE SHARE · 60+ PUBLIC SYSTEMS</text>
    </g>

    <!-- Stacked Distribution Bar -->
    <g transform="translate(0, 20)">
      <!-- Background track -->
      <rect width="520" height="8" rx="4" fill="#001129" stroke="#1e2d45" stroke-width="0.6"/>
      <!-- TypeScript (58.3%) -->
      <rect x="0" y="0" width="303" height="8" rx="4" fill="#2E4AF9"/>
      <!-- JavaScript (15.0%) -->
      <rect x="304" y="0" width="78" height="8" fill="#5277FF"/>
      <!-- PHP (11.7%) -->
      <rect x="383" y="0" width="61" height="8" fill="#435388"/>
      <!-- Python (6.7%) -->
      <rect x="445" y="0" width="35" height="8" fill="#2F6B9A"/>
      <!-- Other (8.3%) -->
      <rect x="481" y="0" width="39" height="8" rx="4" fill="#1b2a40"/>
    </g>

    <!-- Language Details Grid -->
    <g transform="translate(0, 48)">
      <!-- Item 1: TypeScript -->
      <g transform="translate(0, 0)">
        <rect width="250" height="34" rx="4" fill="#001129" stroke="#1e2d45" stroke-width="0.7"/>
        <circle cx="14" cy="17" r="4" fill="#2E4AF9"/>
        <text class="sans" x="26" y="18" font-size="11.5" font-weight="600" fill="#f0f4ff">TypeScript</text>
        <text class="mono" x="160" y="18" font-size="10.5" fill="#5277FF" font-weight="600">58.3%</text>
        <text class="mono" x="240" y="18" text-anchor="end" font-size="9" fill="#5a6b82">35 repos</text>
      </g>

      <!-- Item 2: JavaScript -->
      <g transform="translate(270, 0)">
        <rect width="250" height="34" rx="4" fill="#001129" stroke="#1e2d45" stroke-width="0.7"/>
        <circle cx="14" cy="17" r="4" fill="#5277FF"/>
        <text class="sans" x="26" y="18" font-size="11.5" font-weight="600" fill="#f0f4ff">JavaScript</text>
        <text class="mono" x="160" y="18" font-size="10.5" fill="#8391A8" font-weight="600">15.0%</text>
        <text class="mono" x="240" y="18" text-anchor="end" font-size="9" fill="#5a6b82">9 repos</text>
      </g>

      <!-- Item 3: PHP / Laravel -->
      <g transform="translate(0, 42)">
        <rect width="250" height="34" rx="4" fill="#001129" stroke="#1e2d45" stroke-width="0.7"/>
        <circle cx="14" cy="17" r="4" fill="#435388"/>
        <text class="sans" x="26" y="18" font-size="11.5" font-weight="600" fill="#f0f4ff">PHP · Laravel</text>
        <text class="mono" x="160" y="18" font-size="10.5" fill="#8391A8" font-weight="600">11.7%</text>
        <text class="mono" x="240" y="18" text-anchor="end" font-size="9" fill="#5a6b82">7 repos</text>
      </g>

      <!-- Item 4: Python / ML -->
      <g transform="translate(270, 42)">
        <rect width="250" height="34" rx="4" fill="#001129" stroke="#1e2d45" stroke-width="0.7"/>
        <circle cx="14" cy="17" r="4" fill="#2F6B9A"/>
        <text class="sans" x="26" y="18" font-size="11.5" font-weight="600" fill="#f0f4ff">Python · ML</text>
        <text class="mono" x="160" y="18" font-size="10.5" fill="#8391A8" font-weight="600">6.7%</text>
        <text class="mono" x="240" y="18" text-anchor="end" font-size="9" fill="#5a6b82">4 repos</text>
      </g>

      <!-- Item 5: Kotlin & Others -->
      <g transform="translate(0, 84)">
        <rect width="250" height="34" rx="4" fill="#001129" stroke="#1e2d45" stroke-width="0.7"/>
        <circle cx="14" cy="17" r="4" fill="#7F52FF"/>
        <text class="sans" x="26" y="18" font-size="11.5" font-weight="600" fill="#f0f4ff">Kotlin · Mobile</text>
        <text class="mono" x="160" y="18" font-size="10.5" fill="#8391A8">3.3%</text>
        <text class="mono" x="240" y="18" text-anchor="end" font-size="9" fill="#5a6b82">2 repos</text>
      </g>

      <!-- Item 6: HTML & Systems -->
      <g transform="translate(270, 84)">
        <rect width="250" height="34" rx="4" fill="#001129" stroke="#1e2d45" stroke-width="0.7"/>
        <circle cx="14" cy="17" r="4" fill="#1b2a40"/>
        <text class="sans" x="26" y="18" font-size="11.5" font-weight="600" fill="#f0f4ff">Other Tech</text>
        <text class="mono" x="160" y="18" font-size="10.5" fill="#8391A8">5.0%</text>
        <text class="mono" x="240" y="18" text-anchor="end" font-size="9" fill="#5a6b82">3 repos</text>
      </g>
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="586" y1="52" x2="586" y2="236" stroke="#1e2d45" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- ========================================================= -->
  <!-- RIGHT PANEL: Verified Engineering Metrics                 -->
  <!-- ========================================================= -->
  <g transform="translate(616, 52)">
    <g class="mono" font-size="8.5" fill="#8391A8" letter-spacing="1.2">
      <text x="0" y="10">PRODUCTION FOCUS · VERIFIED METRICS</text>
    </g>

    <!-- 2x2 Metric Cards Grid -->
    <g transform="translate(0, 20)">
      <!-- Card 1: 64 Repos -->
      <g transform="translate(0, 0)">
        <rect width="260" height="74" rx="6" fill="url(#cardGrad)" stroke="#1e2d45" stroke-width="0.8"/>
        <text class="sans" x="18" y="36" font-size="28" font-weight="800" fill="#f0f4ff">64<tspan fill="#2E4AF9" font-size="20">+</tspan></text>
        <text class="sans" x="18" y="52" font-size="11.5" font-weight="600" fill="#c4d0e2">Public Repositories</text>
        <text class="sans" x="18" y="65" font-size="9.5" fill="#5a6b82">Full-stack, SaaS &amp; tools</text>
      </g>

      <!-- Card 2: 800+ Contributions -->
      <g transform="translate(284, 0)">
        <rect width="264" height="74" rx="6" fill="url(#cardGrad)" stroke="#1e2d45" stroke-width="0.8"/>
        <text class="sans" x="18" y="36" font-size="28" font-weight="800" fill="#f0f4ff">800<tspan fill="#5277FF" font-size="20">+</tspan></text>
        <text class="sans" x="18" y="52" font-size="11.5" font-weight="600" fill="#c4d0e2">Annual Contributions</text>
        <text class="sans" x="18" y="65" font-size="9.5" fill="#5a6b82">Active continuous delivery</text>
      </g>

      <!-- Card 3: Enterprise Architecture -->
      <g transform="translate(0, 84)">
        <rect width="260" height="78" rx="6" fill="url(#cardGrad)" stroke="#1e2d45" stroke-width="0.8"/>
        <text class="mono" x="18" y="24" font-size="8.5" fill="#2E4AF9" font-weight="700">CORE FOCUS</text>
        <text class="sans" x="18" y="46" font-size="13" font-weight="700" fill="#f0f4ff">Multi-Tenant SaaS</text>
        <text class="sans" x="18" y="64" font-size="9.5" fill="#8391A8">Tenant isolation &amp; double-entry ledgers</text>
      </g>

      <!-- Card 4: Intelligent Systems -->
      <g transform="translate(284, 84)">
        <rect width="264" height="78" rx="6" fill="url(#cardGrad)" stroke="#2E4AF9" stroke-width="1"/>
        <text class="mono" x="18" y="24" font-size="8.5" fill="#5277FF" font-weight="700">AI SYSTEMS</text>
        <text class="sans" x="18" y="46" font-size="13" font-weight="700" fill="#f0f4ff">Autonomous Workflows</text>
        <text class="sans" x="18" y="64" font-size="9.5" fill="#8391A8">Bengali NLP, speech &amp; 51-tool agents</text>
      </g>
    </g>
  </g>
</svg>

