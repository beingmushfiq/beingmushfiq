<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="auto" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Mushfiqur Rahman — Digital Engineering Atelier</title>
  <desc id="heroDesc">Full Stack Developer, AI Systems Builder, and Founder of DevCenterPoint. Turning complex inefficiencies into resilient software systems.</desc>

  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000A1A" />
      <stop offset="45%" stop-color="#000F26" />
      <stop offset="100%" stop-color="#001433" />
    </linearGradient>

    <radialGradient id="cobaltGlow1" cx="80%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#2E4AF9" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#142680" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000F26" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cobaltGlow2" cx="20%" cy="80%" r="35%">
      <stop offset="0%" stop-color="#2E4AF9" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000F26" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E4AF9" stop-opacity="0" />
      <stop offset="25%" stop-color="#2E4AF9" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#7B92FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2E4AF9" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00173D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#000F26" stop-opacity="0.9" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#24334D" stroke-width="0.7" stroke-opacity="0.35" />
    </pattern>

    <pattern id="dots" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1" fill="#71809A" fill-opacity="0.3" />
    </pattern>

    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
      
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.04); }
      }
      @keyframes beacon {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      @keyframes signalSweep {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      
      .beacon-pip { animation: beacon 2.8s ease-in-out infinite; }
      .pulse-node { transform-origin: center; animation: pulseGlow 4s ease-in-out infinite; }
      .stream-line { stroke-dasharray: 8 6; animation: signalSweep 12s linear infinite; }

      @media (prefers-reduced-motion: reduce) {
        .beacon-pip, .pulse-node, .stream-line { animation: none; }
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="460" rx="14" fill="url(#bgGrad)" stroke="#24334D" stroke-width="1.2" />

  <!-- Grid & Glow Overlays -->
  <rect width="1200" height="460" rx="14" fill="url(#grid)" />
  <rect width="1200" height="460" rx="14" fill="url(#dots)" />
  <rect width="1200" height="460" rx="14" fill="url(#cobaltGlow1)" />
  <rect width="1200" height="460" rx="14" fill="url(#cobaltGlow2)" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accentLine)" />

  <!-- Architectural Corner Crosshairs -->
  <g stroke="#71809A" stroke-width="1" opacity="0.6">
    <path d="M 28 36 L 44 36 M 36 28 L 36 44" />
    <path d="M 1156 36 L 1172 36 M 1164 28 L 1164 44" />
    <path d="M 28 424 L 44 424 M 36 416 L 36 432" />
    <path d="M 1156 424 L 1172 424 M 1164 416 L 1164 432" />
  </g>

  <!-- Technical Telemetry Header -->
  <g class="mono" font-size="11" fill="#71809A" letter-spacing="1.5">
    <text x="56" y="40">ATELIER // ARCHITECTURAL KERNEL v4.8</text>
    <text x="600" y="40" text-anchor="middle">LOC: 23.8103° N, 90.4125° E · DHAKA, BD</text>
    <text x="1144" y="40" text-anchor="end">SYS_STATUS: ACTIVE</text>
  </g>

  <!-- Hairline Divider under Header -->
  <line x1="56" y1="52" x2="1144" y2="52" stroke="#24334D" stroke-width="1" stroke-opacity="0.8" />

  <!-- LEFT HERO SECTION -->
  <g transform="translate(64, 86)">
    <!-- Studio Tag Badge -->
    <g transform="translate(0, 0)">
      <rect width="270" height="26" rx="5" fill="#00163A" stroke="#24334D" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#2E4AF9" class="beacon-pip" />
      <circle cx="14" cy="13" r="7" stroke="#2E4AF9" stroke-width="0.8" fill="none" opacity="0.6" />
      <text class="mono" x="28" y="17" font-size="10.5" fill="#DCE6FF" font-weight="600" letter-spacing="1.5">DEVCENTERPOINT · STUDIO</text>
    </g>

    <!-- Name Heading -->
    <text class="sans" x="0" y="72" font-size="44" font-weight="800" fill="#F5F7FF" letter-spacing="-0.5">
      MUSHFIQUR RAHMAN
    </text>

    <!-- Professional Positioning -->
    <g transform="translate(0, 102)">
      <text class="sans" x="0" y="0" font-size="19" font-weight="500" fill="#DCE6FF">
        Full Stack Developer <tspan fill="#2E4AF9">·</tspan> AI Systems Builder <tspan fill="#2E4AF9">·</tspan> Studio Founder
      </text>
    </g>

    <!-- Mission & Engineering Philosophy Copy -->
    <g transform="translate(0, 138)">
      <rect x="0" y="-12" width="510" height="72" rx="8" fill="url(#cardGrad)" stroke="#24334D" stroke-width="1" />
      <line x1="0" y1="-12" x2="0" y2="60" stroke="#2E4AF9" stroke-width="3" />
      <text class="sans" x="18" y="14" font-size="13.5" fill="#A8B3C7" line-height="1.6">
        “We turn inefficient business processes into software.”
      </text>
      <text class="sans" x="18" y="38" font-size="12.5" fill="#71809A">
        Engineering high-assurance enterprise systems, multimodal AI engines,
      </text>
      <text class="sans" x="18" y="54" font-size="12.5" fill="#71809A">
        and production SaaS infrastructure from inception to scale.
      </text>
    </g>

    <!-- Studio Model Pipeline Indicator -->
    <g transform="translate(0, 238)">
      <text class="mono" x="0" y="-8" font-size="9.5" fill="#71809A" letter-spacing="1.2">SYSTEM PIPELINE ARCHITECTURE</text>
      
      <!-- Stage 1 -->
      <g transform="translate(0, 4)">
        <rect width="144" height="30" rx="4" fill="#001129" stroke="#24334D" stroke-width="1" />
        <text class="mono" x="10" y="19" font-size="10" fill="#DCE6FF" font-weight="500">01 SOFTWARE STUDIO</text>
      </g>
      
      <!-- Arrow 1 -->
      <path d="M 152 19 L 168 19 M 164 15 L 168 19 L 164 23" stroke="#2E4AF9" stroke-width="1.4" fill="none" />
      
      <!-- Stage 2 -->
      <g transform="translate(176, 4)">
        <rect width="170" height="30" rx="4" fill="#001433" stroke="#2E4AF9" stroke-width="1" />
        <text class="mono" x="10" y="19" font-size="10" fill="#F5F7FF" font-weight="600">02 PRODUCTIZED UNITS</text>
      </g>
      
      <!-- Arrow 2 -->
      <path d="M 354 19 L 370 19 M 366 15 L 370 19 L 366 23" stroke="#2E4AF9" stroke-width="1.4" fill="none" />
      
      <!-- Stage 3 -->
      <g transform="translate(378, 4)">
        <rect width="138" height="30" rx="4" fill="#001129" stroke="#24334D" stroke-width="1" />
        <text class="mono" x="10" y="19" font-size="10" fill="#DCE6FF" font-weight="500">03 SCALABLE SAAS</text>
      </g>
    </g>
  </g>

  <!-- RIGHT SCHEMATIC: ARCHITECTURAL SYSTEM TOPOLOGY -->
  <g transform="translate(680, 80)">
    <!-- Subdued blueprint backplate -->
    <rect x="0" y="0" width="460" height="330" rx="10" fill="#001129" stroke="#24334D" stroke-width="1" fill-opacity="0.6" />

    <!-- Technical Header of Schematic -->
    <g class="mono" font-size="9.5" fill="#71809A" letter-spacing="1">
      <text x="18" y="24">TOPOLOGY // DISTRIBUTED PLATFORM MATRIX</text>
      <circle cx="434" cy="20" r="3" fill="#2E4AF9" />
    </g>
    <line x1="18" y1="34" x2="442" y2="34" stroke="#24334D" stroke-width="0.8" />

    <!-- Orbital Rings -->
    <g transform="translate(230, 185)">
      <circle cx="0" cy="0" r="120" stroke="#24334D" stroke-width="0.8" fill="none" stroke-opacity="0.4" stroke-dasharray="4 4" />
      <circle cx="0" cy="0" r="85" stroke="#2E4AF9" stroke-width="1" fill="none" stroke-opacity="0.3" />
      <circle cx="0" cy="0" r="48" stroke="#2E4AF9" stroke-width="1.4" fill="#000F26" class="pulse-node" />
      
      <!-- Center Core Hub -->
      <rect x="-38" y="-16" width="76" height="32" rx="4" fill="#001A47" stroke="#2E4AF9" stroke-width="1.2" />
      <text class="mono" x="0" y="4" font-size="10" fill="#F5F7FF" font-weight="700" text-anchor="middle" letter-spacing="1">DCP CORE</text>
      
      <!-- Node 1: ProERP (North-West) -->
      <line x1="-34" y1="-26" x2="-100" y2="-72" stroke="#24334D" stroke-width="1.2" class="stream-line" />
      <g transform="translate(-155, -92)">
        <rect width="110" height="32" rx="4" fill="#00163A" stroke="#24334D" stroke-width="1" />
        <circle cx="12" cy="16" r="3" fill="#2E4AF9" />
        <text class="mono" x="22" y="15" font-size="9" fill="#F5F7FF" font-weight="600">ProERP</text>
        <text class="sans" x="22" y="25" font-size="7.5" fill="#71809A">Manufacturing Ops</text>
      </g>

      <!-- Node 2: Ultron AI (North-East) -->
      <line x1="34" y1="-26" x2="98" y2="-72" stroke="#2E4AF9" stroke-width="1.2" class="stream-line" />
      <g transform="translate(65, -92)">
        <rect width="112" height="32" rx="4" fill="#00163A" stroke="#2E4AF9" stroke-width="1" />
        <circle cx="12" cy="16" r="3" fill="#7B92FF" />
        <text class="mono" x="22" y="15" font-size="9" fill="#F5F7FF" font-weight="600">ULTRON AI</text>
        <text class="sans" x="22" y="25" font-size="7.5" fill="#DCE6FF">Autonomous Desktop</text>
      </g>

      <!-- Node 3: ORG Multi-Tenant (South-West) -->
      <line x1="-34" y1="26" x2="-98" y2="70" stroke="#24334D" stroke-width="1.2" class="stream-line" />
      <g transform="translate(-160, 60)">
        <rect width="118" height="32" rx="4" fill="#00163A" stroke="#24334D" stroke-width="1" />
        <circle cx="12" cy="16" r="3" fill="#2E4AF9" />
        <text class="mono" x="22" y="15" font-size="9" fill="#F5F7FF" font-weight="600">ORG SYSTEM</text>
        <text class="sans" x="22" y="25" font-size="7.5" fill="#71809A">Multi-Tenant Ledgers</text>
      </g>

      <!-- Node 4: KothaLipi AI (South-East) -->
      <line x1="34" y1="26" x2="98" y2="70" stroke="#24334D" stroke-width="1.2" class="stream-line" />
      <g transform="translate(65, 60)">
        <rect width="115" height="32" rx="4" fill="#00163A" stroke="#24334D" stroke-width="1" />
        <circle cx="12" cy="16" r="3" fill="#2E4AF9" />
        <text class="mono" x="22" y="15" font-size="9" fill="#F5F7FF" font-weight="600">KOTHALIPI</text>
        <text class="sans" x="22" y="25" font-size="7.5" fill="#71809A">Multimodal Bengali NLP</text>
      </g>
    </g>

    <!-- Schematic Footer Coordinates -->
    <g class="mono" font-size="8.5" fill="#71809A" letter-spacing="1">
      <text x="18" y="316">SECURE CONDUIT // 256-BIT ENCRYPTION</text>
      <text x="442" y="316" text-anchor="end">NODE_SYNC: 99.98%</text>
    </g>
  </g>

  <!-- Bottom Accent / Telemetry Bar -->
  <line x1="56" y1="432" x2="1144" y2="432" stroke="#24334D" stroke-width="1" stroke-opacity="0.8" />
  <g class="mono" font-size="9.5" fill="#71809A" letter-spacing="1">
    <text x="56" y="446">PRODUCTION STACK: REACT 19 · TYPESCRIPT · LARAVEL · NODE · PYTHON ML</text>
    <text x="1144" y="446" text-anchor="end">PORTFOLIO EDITION // 2026.4</text>
  </g>
</svg>

