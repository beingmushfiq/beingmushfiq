<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Mushfiqur Rahman Aayan — Digital Engineering Atelier</title>
  <desc id="heroDesc">Full Stack Developer, AI Systems Builder, and Founder of DevCenterPoint. Turning complex business processes into high-assurance software systems.</desc>

  <defs>
    <!-- Background Canvas Gradients -->
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000714" />
      <stop offset="40%" stop-color="#000F26" />
      <stop offset="100%" stop-color="#001438" />
    </linearGradient>

    <!-- Deep Ambient Glows -->
    <radialGradient id="cobaltFocal" cx="82%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#2E4AF9" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#142680" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000F26" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="subtleAura" cx="15%" cy="85%" r="35%">
      <stop offset="0%" stop-color="#2E4AF9" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000F26" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="hairlineAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E4AF9" stop-opacity="0" />
      <stop offset="20%" stop-color="#2E4AF9" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#7B92FF" stop-opacity="1" />
      <stop offset="80%" stop-color="#2E4AF9" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#2E4AF9" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B92FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#2E4AF9" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#142680" stop-opacity="0.2" />
    </linearGradient>

    <!-- Precision Architectural Drafting Grid -->
    <pattern id="archGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#24334D" stroke-width="0.6" stroke-opacity="0.4" />
    </pattern>

    <pattern id="majorGrid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="#2E4AF9" stroke-width="0.8" stroke-opacity="0.15" />
      <circle cx="0" cy="0" r="1.5" fill="#71809A" opacity="0.6" />
    </pattern>

    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }

      @keyframes beaconBlink {
        0%, 100% { opacity: 0.35; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes orbitRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseRing {
        0% { r: 55; opacity: 0.5; }
        50% { r: 75; opacity: 0.1; }
        100% { r: 55; opacity: 0.5; }
      }

      .beacon-dot { transform-origin: 20px 14px; animation: beaconBlink 2.5s ease-in-out infinite; }
      .cursor-blink { animation: cursorBlink 1.1s infinite; }
      .orbit-group { transform-origin: 220px 165px; animation: orbitRotate 30s linear infinite; }
      .pulse-ring { animation: pulseRing 5s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .beacon-dot, .cursor-blink, .orbit-group, .pulse-ring { animation: none; }
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="420" rx="14" fill="url(#canvasGrad)" stroke="#24334D" stroke-width="1.2" />

  <!-- Technical Grid Overlays -->
  <rect width="1200" height="420" rx="14" fill="url(#archGrid)" />
  <rect width="1200" height="420" rx="14" fill="url(#majorGrid)" />

  <!-- Ambient Light Auras -->
  <rect width="1200" height="420" rx="14" fill="url(#cobaltFocal)" />
  <rect width="1200" height="420" rx="14" fill="url(#subtleAura)" />

  <!-- Top Accent Laser Line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#hairlineAccent)" />

  <!-- Corner Brackets (Architectural Viewport Marks) -->
  <g stroke="#71809A" stroke-width="1" opacity="0.65">
    <path d="M 24 34 L 40 34 M 32 26 L 32 42" />
    <path d="M 1160 34 L 1176 34 M 1168 26 L 1168 42" />
    <path d="M 24 386 L 40 386 M 32 378 L 32 394" />
    <path d="M 1160 386 L 1176 386 M 1168 378 L 1168 394" />
  </g>

  <!-- Top Telemetry Header -->
  <g class="mono" font-size="10" fill="#71809A" letter-spacing="1.5">
    <text x="56" y="38">SYSTEM CORE // DEVCENTERPOINT ATELIER v5.2</text>
    <text x="600" y="38" text-anchor="middle">LOC: 23.8103° N, 90.4125° E · DHAKA, BD</text>
    <text x="1144" y="38" text-anchor="end">KERNEL: PRODUCTION_READY</text>
  </g>
  <line x1="56" y1="48" x2="1144" y2="48" stroke="#24334D" stroke-width="0.8" />

  <!-- LEFT HERO PANE -->
  <g transform="translate(60, 78)">
    <!-- Live Status Pill -->
    <g transform="translate(0, 0)">
      <rect width="280" height="26" rx="5" fill="#00163A" stroke="#24334D" stroke-width="1" />
      <circle cx="16" cy="13" r="4.5" fill="#2E4AF9" class="beacon-dot" />
      <circle cx="16" cy="13" r="8" stroke="#2E4AF9" stroke-width="0.8" fill="none" opacity="0.5" />
      <text class="mono" x="32" y="17" font-size="10" fill="#DCE6FF" font-weight="600" letter-spacing="1.4">FOUNDER · DEVCENTERPOINT</text>
    </g>

    <!-- Full Authoritative Name -->
    <g transform="translate(0, 68)">
      <text class="sans" x="0" y="0" font-size="44" font-weight="800" fill="#F5F7FF" letter-spacing="-0.5">
        MUSHFIQUR RAHMAN AAYAN
      </text>
    </g>

    <!-- Animated Terminal Subtitle Line -->
    <g transform="translate(0, 102)">
      <rect x="0" y="-16" width="540" height="32" rx="4" fill="#001129" stroke="#24334D" stroke-width="0.8" />
      <text class="mono" x="14" y="5" font-size="13.5" fill="#2E4AF9" font-weight="700">&gt;</text>
      <text class="mono" x="32" y="5" font-size="13" fill="#DCE6FF" font-weight="500">
        Full Stack Developer · AI Systems Builder · Founder
      </text>
      <rect x="496" y="-8" width="8" height="15" fill="#2E4AF9" class="cursor-blink" />
    </g>

    <!-- Strategic Philosophy Card -->
    <g transform="translate(0, 146)">
      <rect width="540" height="64" rx="6" fill="#001438" stroke="#24334D" stroke-width="1" fill-opacity="0.85" />
      <rect x="0" y="0" width="3" height="64" fill="#2E4AF9" />
      <text class="sans" x="18" y="24" font-size="14" font-weight="600" fill="#F5F7FF">
        “We turn inefficient business processes into software.”
      </text>
      <text class="sans" x="18" y="46" font-size="12" fill="#A8B3C7">
        High-assurance systems, quantitative engines, and multimodal intelligence.
      </text>
    </g>

    <!-- Core Capability Tag Matrix -->
    <g transform="translate(0, 230)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="124" height="26" rx="4" fill="#001129" stroke="#24334D" stroke-width="0.8" />
        <text class="mono" x="10" y="17" font-size="9" fill="#A8B3C7">ENTERPRISE SAAS</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(132, 0)">
        <rect width="118" height="26" rx="4" fill="#00163A" stroke="#2E4AF9" stroke-width="1" />
        <text class="mono" x="10" y="17" font-size="9" fill="#DCE6FF" font-weight="600">MULTIMODAL AI</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(258, 0)">
        <rect width="138" height="26" rx="4" fill="#001129" stroke="#24334D" stroke-width="0.8" />
        <text class="mono" x="10" y="17" font-size="9" fill="#A8B3C7">QUANT FINTECH</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(404, 0)">
        <rect width="136" height="26" rx="4" fill="#001129" stroke="#24334D" stroke-width="0.8" />
        <text class="mono" x="10" y="17" font-size="9" fill="#A8B3C7">SPATIAL WEBGL</text>
      </g>
    </g>
  </g>

  <!-- RIGHT ARCHITECTURAL SCHEMATIC: 3D ISOMETRIC KERNEL & ORBITAL SATELLITES -->
  <g transform="translate(690, 70)">
    <!-- Container Shield -->
    <rect width="450" height="290" rx="10" fill="#000F26" stroke="#24334D" stroke-width="1" fill-opacity="0.7" />

    <!-- Top Coordinate Bar -->
    <g class="mono" font-size="9" fill="#71809A" letter-spacing="1">
      <text x="16" y="22">SCHEMATIC // ISOMETRIC KERNEL TOPOLOGY</text>
      <circle cx="432" cy="18" r="3" fill="#2E4AF9" />
    </g>
    <line x1="16" y1="30" x2="434" y2="30" stroke="#24334D" stroke-width="0.8" />

    <!-- Center System Composition (220, 155) -->
    <g transform="translate(225, 155)">
      <!-- Pulsing Radar Rings -->
      <circle cx="0" cy="0" r="105" stroke="#24334D" stroke-width="0.8" stroke-dasharray="4 4" fill="none" opacity="0.4" />
      <circle cx="0" cy="0" r="75" stroke="#2E4AF9" stroke-width="1" fill="none" opacity="0.35" class="pulse-ring" />
      
      <!-- Rotating Orbital Ring -->
      <g class="orbit-group" transform="translate(-220, -165)">
        <ellipse cx="220" cy="165" rx="90" ry="48" stroke="#7B92FF" stroke-width="1" fill="none" stroke-opacity="0.4" transform="rotate(-25 220 165)" />
        <!-- Satellite 1 -->
        <circle cx="140" cy="130" r="4" fill="#2E4AF9" />
        <circle cx="140" cy="130" r="7" stroke="#7B92FF" stroke-width="0.8" fill="none" />
        <!-- Satellite 2 -->
        <circle cx="300" cy="200" r="4" fill="#DCE6FF" />
      </g>

      <!-- Isometric Central Cube Wireframe -->
      <g stroke="url(#wireGrad)" stroke-width="1.4" fill="#001438" fill-opacity="0.85">
        <!-- Top Face -->
        <polygon points="0,-48 42,-24 0,0 -42,-24" fill="#001C4D" />
        <!-- Left Face -->
        <polygon points="-42,-24 0,0 0,48 -42,24" fill="#00102B" />
        <!-- Right Face -->
        <polygon points="0,0 42,-24 42,24 0,48" fill="#00163D" />
      </g>

      <!-- Center Gem / Hub Text -->
      <circle cx="0" cy="0" r="14" fill="#000F26" stroke="#2E4AF9" stroke-width="1.6" />
      <circle cx="0" cy="0" r="4" fill="#F5F7FF" />
      
      <!-- Radiating Connector Lines to 4 Satellite Nodes -->
      <!-- Node 1: North West (ProERP) -->
      <line x1="-30" y1="-30" x2="-110" y2="-65" stroke="#24334D" stroke-width="1.2" stroke-dasharray="3 3" />
      <g transform="translate(-165, -82)">
        <rect width="82" height="24" rx="3" fill="#00163A" stroke="#24334D" stroke-width="0.8" />
        <text class="mono" x="8" y="15" font-size="8.5" fill="#F5F7FF" font-weight="600">ProERP</text>
        <circle cx="70" cy="12" r="2.5" fill="#2E4AF9" />
      </g>

      <!-- Node 2: North East (KothaLipi) -->
      <line x1="30" y1="-30" x2="110" y2="-65" stroke="#2E4AF9" stroke-width="1.2" stroke-dasharray="3 3" />
      <g transform="translate(85, -82)">
        <rect width="90" height="24" rx="3" fill="#00163A" stroke="#2E4AF9" stroke-width="1" />
        <text class="mono" x="8" y="15" font-size="8.5" fill="#F5F7FF" font-weight="600">KothaLipi</text>
        <circle cx="78" cy="12" r="2.5" fill="#7B92FF" />
      </g>

      <!-- Node 3: South West (ORG System) -->
      <line x1="-30" y1="30" x2="-110" y2="65" stroke="#24334D" stroke-width="1.2" stroke-dasharray="3 3" />
      <g transform="translate(-165, 58)">
        <rect width="82" height="24" rx="3" fill="#00163A" stroke="#24334D" stroke-width="0.8" />
        <text class="mono" x="8" y="15" font-size="8.5" fill="#A8B3C7">ORG SaaS</text>
        <circle cx="70" cy="12" r="2.5" fill="#2E4AF9" />
      </g>

      <!-- Node 4: South East (SMC / Quant) -->
      <line x1="30" y1="30" x2="110" y2="65" stroke="#2E4AF9" stroke-width="1.2" stroke-dasharray="3 3" />
      <g transform="translate(85, 58)">
        <rect width="90" height="24" rx="3" fill="#00163A" stroke="#24334D" stroke-width="0.8" />
        <text class="mono" x="8" y="15" font-size="8.5" fill="#F5F7FF" font-weight="600">Quant/SMC</text>
        <circle cx="78" cy="12" r="2.5" fill="#DCE6FF" />
      </g>
    </g>

    <!-- Bottom Readout Diagnostics -->
    <g class="mono" font-size="8.5" fill="#71809A" letter-spacing="1">
      <text x="16" y="274">PROTOCOL: TCP/WSS ENCRYPTED</text>
      <text x="434" y="274" text-anchor="end" fill="#2E4AF9">PIPELINE: ACTIVE</text>
    </g>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <line x1="56" y1="394" x2="1144" y2="394" stroke="#24334D" stroke-width="1" stroke-opacity="0.8" />
  <g class="mono" font-size="9" fill="#71809A" letter-spacing="1.2">
    <text x="56" y="408">TECH ENGINE: REACT 19 · TYPESCRIPT · LARAVEL · NODE · PYTHON ML · THREE.JS</text>
    <a href="https://devcenterpoint.com" target="_blank">
      <text x="1144" y="408" text-anchor="end" fill="#2E4AF9" font-weight="700">EXPLORE STUDIO: DEVCENTERPOINT.COM ↗</text>
    </a>
  </g>
</svg>
