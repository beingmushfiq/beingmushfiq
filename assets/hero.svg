<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="auto" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Mushfiqur Rahman — Full Stack Developer &amp; AI Builder</title>
  <desc id="heroDesc">Full Stack Developer and AI Builder. Founder of DevCenterPoint. Building software that turns complex ideas into practical digital solutions.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000814"/>
      <stop offset="45%" stop-color="#000F26"/>
      <stop offset="100%" stop-color="#001030"/>
    </linearGradient>

    <radialGradient id="glowRight" cx="78%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#2E4AF9" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#142680" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000F26" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowLeft" cx="12%" cy="80%" r="30%">
      <stop offset="0%" stop-color="#2E4AF9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000F26" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="topLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E4AF9" stop-opacity="0"/>
      <stop offset="25%" stop-color="#2E4AF9" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#5277FF" stop-opacity="1"/>
      <stop offset="75%" stop-color="#2E4AF9" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#2E4AF9" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#24334D" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>

    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
      @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .live-dot { animation: pulse 2.5s ease-in-out infinite; }
      .cursor { animation: blink 1s infinite; }
      @media (prefers-reduced-motion: reduce) { .live-dot, .cursor { animation: none; } }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="400" rx="12" fill="url(#bgGrad)" stroke="#1a2744" stroke-width="1"/>
  <rect width="1200" height="400" rx="12" fill="url(#grid)"/>
  <rect width="1200" height="400" rx="12" fill="url(#glowRight)"/>
  <rect width="1200" height="400" rx="12" fill="url(#glowLeft)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="2.5" fill="url(#topLine)"/>

  <!-- Corner marks -->
  <g stroke="#4a5568" stroke-width="0.8" opacity="0.5">
    <path d="M 28 28 L 44 28 M 36 20 L 36 36"/>
    <path d="M 1156 28 L 1172 28 M 1164 20 L 1164 36"/>
    <path d="M 28 372 L 44 372 M 36 364 L 36 380"/>
    <path d="M 1156 372 L 1172 372 M 1164 364 L 1164 380"/>
  </g>

  <!-- Top metadata -->
  <g class="mono" font-size="10" fill="#5a6b82" letter-spacing="1.5">
    <text x="56" y="36">DEVCENTERPOINT · DHAKA, BANGLADESH</text>
    <text x="1144" y="36" text-anchor="end">FULL STACK · AI · SAAS</text>
  </g>
  <line x1="56" y1="46" x2="1144" y2="46" stroke="#1e2d45" stroke-width="0.8"/>

  <!-- LEFT PANE: Identity -->
  <g transform="translate(60, 72)">
    <!-- Role pill -->
    <g>
      <rect width="240" height="24" rx="4" fill="#001129" stroke="#1e2d45" stroke-width="0.8"/>
      <circle cx="14" cy="12" r="3.5" fill="#2E4AF9" class="live-dot"/>
      <text class="mono" x="26" y="16" font-size="9.5" fill="#c4d0e2" letter-spacing="1.2">FOUNDER · DEVCENTERPOINT</text>
    </g>

    <!-- Name -->
    <text class="sans" x="0" y="76" font-size="42" font-weight="800" fill="#f0f4ff" letter-spacing="-0.5">Mushfiqur Rahman</text>

    <!-- Title bar -->
    <g transform="translate(0, 96)">
      <rect x="0" y="-14" width="480" height="28" rx="4" fill="#000d1f" stroke="#1e2d45" stroke-width="0.8"/>
      <text class="mono" x="12" y="4" font-size="12.5" fill="#2E4AF9" font-weight="700">&gt;</text>
      <text class="mono" x="28" y="4" font-size="12" fill="#c4d0e2">Full Stack Developer · AI Builder</text>
      <rect x="322" y="-7" width="7" height="14" fill="#2E4AF9" class="cursor"/>
    </g>

    <!-- Statement card -->
    <g transform="translate(0, 132)">
      <rect width="500" height="52" rx="5" fill="#001333" stroke="#1e2d45" stroke-width="0.8" fill-opacity="0.9"/>
      <rect x="0" y="0" width="3" height="52" fill="#2E4AF9"/>
      <text class="sans" x="16" y="22" font-size="13.5" font-weight="500" fill="#e0e8f5">Building software that turns complex ideas into</text>
      <text class="sans" x="16" y="40" font-size="13.5" font-weight="500" fill="#e0e8f5">practical, reliable digital solutions.</text>
    </g>

    <!-- Capability pills -->
    <g transform="translate(0, 204)">
      <rect width="100" height="24" rx="4" fill="#001129" stroke="#1e2d45" stroke-width="0.8"/>
      <text class="mono" x="10" y="16" font-size="8.5" fill="#8391A8">WEB APPS</text>

      <g transform="translate(108, 0)">
        <rect width="118" height="24" rx="4" fill="#00163A" stroke="#2E4AF9" stroke-width="0.8"/>
        <text class="mono" x="10" y="16" font-size="8.5" fill="#c4d0e2" font-weight="600">SAAS PLATFORMS</text>
      </g>

      <g transform="translate(234, 0)">
        <rect width="110" height="24" rx="4" fill="#001129" stroke="#1e2d45" stroke-width="0.8"/>
        <text class="mono" x="10" y="16" font-size="8.5" fill="#8391A8">AI SYSTEMS</text>
      </g>

      <g transform="translate(352, 0)">
        <rect width="130" height="24" rx="4" fill="#001129" stroke="#1e2d45" stroke-width="0.8"/>
        <text class="mono" x="10" y="16" font-size="8.5" fill="#8391A8">BUSINESS TOOLS</text>
      </g>
    </g>
  </g>

  <!-- RIGHT PANE: Geometric composition -->
  <g transform="translate(700, 60)">
    <rect width="440" height="280" rx="8" fill="#000c1e" stroke="#1e2d45" stroke-width="0.8" fill-opacity="0.6"/>

    <g class="mono" font-size="8.5" fill="#5a6b82" letter-spacing="1">
      <text x="16" y="22">SYSTEM OVERVIEW</text>
      <circle cx="422" cy="18" r="3" fill="#2E4AF9"/>
    </g>
    <line x1="16" y1="30" x2="424" y2="30" stroke="#1e2d45" stroke-width="0.6"/>

    <!-- Concentric circles -->
    <g transform="translate(220, 158)">
      <circle cx="0" cy="0" r="95" stroke="#1e2d45" stroke-width="0.6" stroke-dasharray="4 3" fill="none" opacity="0.5"/>
      <circle cx="0" cy="0" r="65" stroke="#2E4AF9" stroke-width="0.8" fill="none" opacity="0.25"/>
      <circle cx="0" cy="0" r="35" stroke="#24334D" stroke-width="0.6" fill="none" opacity="0.4"/>

      <!-- Center node -->
      <circle cx="0" cy="0" r="16" fill="#000F26" stroke="#2E4AF9" stroke-width="1.4"/>
      <circle cx="0" cy="0" r="4.5" fill="#f0f4ff"/>

      <!-- Satellite nodes with labels -->
      <!-- Top: React/Next.js -->
      <line x1="0" y1="-16" x2="0" y2="-55" stroke="#2E4AF9" stroke-width="0.8" stroke-dasharray="3 2"/>
      <g transform="translate(-36, -80)">
        <rect width="72" height="20" rx="3" fill="#001333" stroke="#1e2d45" stroke-width="0.7"/>
        <text class="mono" x="8" y="14" font-size="8" fill="#c4d0e2">React · TS</text>
      </g>

      <!-- Right: Laravel -->
      <line x1="16" y1="0" x2="55" y2="0" stroke="#24334D" stroke-width="0.8" stroke-dasharray="3 2"/>
      <g transform="translate(60, -10)">
        <rect width="68" height="20" rx="3" fill="#001333" stroke="#1e2d45" stroke-width="0.7"/>
        <text class="mono" x="8" y="14" font-size="8" fill="#c4d0e2">Laravel</text>
      </g>

      <!-- Bottom: Databases -->
      <line x1="0" y1="16" x2="0" y2="55" stroke="#24334D" stroke-width="0.8" stroke-dasharray="3 2"/>
      <g transform="translate(-42, 60)">
        <rect width="84" height="20" rx="3" fill="#001333" stroke="#1e2d45" stroke-width="0.7"/>
        <text class="mono" x="8" y="14" font-size="8" fill="#c4d0e2">PostgreSQL</text>
      </g>

      <!-- Left: Python/AI -->
      <line x1="-16" y1="0" x2="-55" y2="0" stroke="#2E4AF9" stroke-width="0.8" stroke-dasharray="3 2"/>
      <g transform="translate(-130, -10)">
        <rect width="70" height="20" rx="3" fill="#00163A" stroke="#2E4AF9" stroke-width="0.8"/>
        <text class="mono" x="8" y="14" font-size="8" fill="#c4d0e2" font-weight="600">Python AI</text>
      </g>

      <!-- Diagonal: Node.js -->
      <line x1="11" y1="-11" x2="40" y2="-40" stroke="#1e2d45" stroke-width="0.6" stroke-dasharray="2 2"/>
      <g transform="translate(44, -55)">
        <rect width="64" height="20" rx="3" fill="#001333" stroke="#1e2d45" stroke-width="0.7"/>
        <text class="mono" x="8" y="14" font-size="8" fill="#8391A8">Node.js</text>
      </g>

      <!-- Diagonal: Docker -->
      <line x1="11" y1="11" x2="40" y2="40" stroke="#1e2d45" stroke-width="0.6" stroke-dasharray="2 2"/>
      <g transform="translate(44, 35)">
        <rect width="60" height="20" rx="3" fill="#001333" stroke="#1e2d45" stroke-width="0.7"/>
        <text class="mono" x="8" y="14" font-size="8" fill="#8391A8">Docker</text>
      </g>
    </g>

    <!-- Footer -->
    <g class="mono" font-size="8" fill="#4a5568" letter-spacing="1">
      <text x="16" y="268">60+ REPOSITORIES · MULTI-TENANT SAAS</text>
      <text x="424" y="268" text-anchor="end" fill="#2E4AF9">ACTIVE</text>
    </g>
  </g>

  <!-- Bottom bar -->
  <line x1="56" y1="378" x2="1144" y2="378" stroke="#1e2d45" stroke-width="0.8"/>
  <g class="mono" font-size="9" fill="#4a5568" letter-spacing="1">
    <text x="56" y="392">REACT · TYPESCRIPT · LARAVEL · NODE · PYTHON · POSTGRESQL</text>
    <a href="https://devcenterpoint.com">
      <text x="1144" y="392" text-anchor="end" fill="#2E4AF9" font-weight="600">DEVCENTERPOINT.COM ↗</text>
    </a>
  </g>
</svg>

