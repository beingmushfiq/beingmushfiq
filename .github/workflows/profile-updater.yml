name: Profile Telemetry & Snake Automation

on:
  schedule:
    # Run every 24 hours at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/**'
      - '.github/workflows/profile-updater.yml'

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update Recent Repository Activity Feed
        run: node .github/scripts/update-readme.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Contribution Grid Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: beingmushfiq
          outputs: |
            assets/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%232E4AF9&color_dots=%23000F26,%23001844,%23143370,%232E4AF9,%237B92FF

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/github-contribution-grid-snake.svg
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "chore(telemetry): automated update of activity stream and contribution snake [skip ci]"
            git push
          fi
